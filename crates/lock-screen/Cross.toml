[target.aarch64-unknown-linux-gnu]
pre-build = ["dpkg --add-architecture $CROSS_DEB_ARCH", "apt-get update", """
    apt-get install -y --no-install-recommends \\
        clang \\
        libgbm-dev:$CROSS_DEB_ARCH \\
        libdrm-dev:$CROSS_DEB_ARCH \\
        libegl1-mesa-dev:$CROSS_DEB_ARCH \\
        libwayland-dev:$CROSS_DEB_ARCH
    """]
