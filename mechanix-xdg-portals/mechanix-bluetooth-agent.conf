<!-- D-Bus policy for the Mechanix portals Bluetooth agent.
     Allows BlueZ (root) to call org.bluez.Agent1 methods on our
     user-space agent registered at /org/mechanix/bluetooth/agent.  -->

<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Allow any connection to receive Agent1 calls (BlueZ → our agent). -->
  <policy context="default">
    <allow receive_interface="org.bluez.Agent1"/>
  </policy>

</busconfig>
